<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PixelForge Engine</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27><rect width=%2716%27 height=%2716%27 fill=%27%2314161c%27/><rect x=%274%27 y=%274%27 width=%278%27 height=%278%27 fill=%27%237fd4a8%27/></svg>" />
  <link rel="stylesheet" href="/src/editeur/style.css" />
</head>
<body>
  <div class="app">
    <header class="barre">
      <span class="marque">PixelForge <b>Engine</b></span>
      <select id="monde" title="Le monde chargé, et donc la projection"></select>
      <button id="jouer" class="primaire">Jouer</button>
      <button id="arreter" disabled>Arrêter</button>
      <span class="sep"></span>
      <div class="outils" id="outils" role="group" aria-label="Outils d’édition">
        <button data-outil="terrain" class="actif">Mur</button>
        <button data-outil="gomme">Gomme</button>
        <button data-outil="collision">Collision</button>
        <button data-outil="main">Main</button>
      </div>
      <label class="bascule"><input type="checkbox" id="voirCollision" /> Voir les collisions</label>
      <button id="basculeAtelier" title="Écrire le script d’un nœud">Script</button>
      <span class="sep"></span>
      <button id="dossier" title="Choisir le dossier de travail du projet">Dossier…</button>
      <button id="enregistrer" title="Ctrl+S">Enregistrer</button>
      <button id="ouvrir" title="Relire un projet">Ouvrir…</button>
      <span class="pousse"></span>
      <select id="cible" title="Langage du chargeur généré"></select>
      <button id="exporter">Exporter</button>
    </header>
    <div class="corps">
      <main class="scene">
        <canvas id="vue"></canvas>
      </main>
      <aside class="atelier" id="atelier" hidden>
        <div class="atelier-tete">
          <select id="scriptNoeud" title="Le nœud dont on écrit le script"></select>
          <button id="appliquerScript" class="primaire" title="Ctrl+Entrée">Appliquer</button>
          <button id="retablirScript" disabled>Rétablir</button>
          <span class="pousse"></span>
          <button id="fermerAtelier" title="Fermer">✕</button>
        </div>
        <textarea id="scriptSource" spellcheck="false" autocomplete="off"
          aria-label="Script du nœud"></textarea>
        <p class="atelier-message" id="scriptMessage"></p>
        <details class="atelier-aide">
          <summary>Ce dont un script dispose</summary>
          <pre id="scriptAide"></pre>
        </details>
      </aside>
    </div>
    <footer class="pied">
      <span id="aide"></span>
      <span class="pousse"></span>
      <span class="info" id="verdict"></span>
      <span class="sep"></span>
      <span class="info" id="info"></span>
      <span class="sep"></span>
      <span id="mesure"></span>
    </footer>
  </div>
  <script type="module" src="/src/editeur/main.ts"></script>
</body>
</html>
