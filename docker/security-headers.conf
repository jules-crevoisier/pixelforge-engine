# Inclus dans chaque bloc qui declare ses propres en-tetes : nginx remplace
# les `add_header` herites des qu'un bloc en definit un.
#
# ## `'unsafe-eval'`, et pourquoi il est la
#
# L'atelier de scripts COMPILE ce que la personne ecrit : `new Function`, dans
# `script/atelier.ts`. Sans `'unsafe-eval'`, le navigateur le refuse et
# l'atelier meurt en production — en silence, avec un message qui parle de
# script invalide. C'est exactement le genre de defaut qu'on ne decouvre
# qu'une fois deploye.
#
# La seule alternative serait d'ecrire un interprete, c'est-a-dire beaucoup
# plus de code pour EXACTEMENT le meme pouvoir : dans les deux cas, ce que la
# personne ecrit s'execute. L'atelier refuse deja `document`, `fetch` et
# `localStorage`, et le dit.
#
# Ce que `'unsafe-eval'` n'ouvre PAS : ni script distant, ni script en ligne
# dans la page. `script-src 'self'` continue de les interdire tous les deux.
#
# Un banc verifie que cette ligne et le code restent d'accord : si l'atelier
# cessait d'employer `new Function`, il demanderait qu'on retire la
# permission — une permission qui ne sert plus est une permission a retirer.
#
# ## Le reste
#
# Aucune exception au « tout local » : la page ne charge rien qu'elle ne serve
# elle-meme. Les schemas toleres — `data:` et `blob:` — restent des donnees
# produites par la page : les PNG des planches, les archives d'export, les
# fichiers d'onde de la musique, le projet qu'on telecharge.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; media-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options     "nosniff" always;
add_header Referrer-Policy            "no-referrer" always;
add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
# Aucune fenetre tierce a laisser repondre : on referme l'isolation.
add_header Cross-Origin-Opener-Policy "same-origin" always;
