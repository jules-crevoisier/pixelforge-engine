# Le meme service, mais sur une machine sans Dokploy : le port est publie sur
# l'hote et il n'y a aucun reseau externe a joindre.
#
#     docker compose -f docker-compose.local.yml up -d --build
#     puis http://localhost:8080/
#
# C'est aussi la facon d'eprouver l'image AVANT de la pousser : une image qui
# se construit ne prouve pas qu'elle sert quelque chose.

services:
  pixelforge-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: pixelforge-engine:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--tries=1", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
