<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PixelForge — jeu</title>
  <style>
    /* Le strict necessaire d'une page de jeu : noir, centre, pixels nets.
       Aucune classe partagee avec l'editeur — cette page doit tenir seule. */
    html, body { margin: 0; height: 100%; background: #0b0d12; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; outline: none; max-width: 100vw; max-height: 100vh; }
  </style>
  <!-- Le projet, inline par l'export. Vide ici : la page de developpement
       le prend alors par fetch, ce qui permet de la tester telle quelle. -->
  <script id="projet" type="application/json"></script>
</head>
<body>
  <canvas id="vue" tabindex="0" aria-label="Le jeu"></canvas>
  <script type="module" src="/src/joueur/main.ts"></script>
</body>
</html>
