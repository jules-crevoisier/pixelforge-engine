# Deploiement Dokploy (application de type « Docker Compose »).
#
# Aucun port n'est publie sur l'hote : Traefik joint le conteneur par le
# reseau interne `dokploy-network`, gere le domaine et le certificat. C'est
# aussi ce qui evite tout conflit avec un service deja en ecoute sur l'hote.
#
# Dans Dokploy : onglet Domains -> Host = votre domaine, Service =
# `pixelforge-engine`, Container Port = 8080. Les labels Traefik sont ajoutes
# automatiquement.
#
# Pour lancer sur une machine sans Dokploy :
#     docker compose -f docker-compose.local.yml up -d --build

services:
  pixelforge-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: pixelforge-engine:latest
    restart: unless-stopped

    # Visible uniquement depuis le reseau Docker, jamais depuis l'hote.
    expose:
      - "8080"

    networks:
      - dokploy-network

    # Le site est entierement statique : rien n'a besoin d'etre ecrit sur le
    # disque. Seuls les fichiers temporaires de nginx vivent en memoire.
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--tries=1", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Les etiquettes Traefik sont ECRITES ICI, et non laissees a
    # l'orchestrateur.
    #
    # Dokploy sait les ajouter lui-meme pour une application ordinaire. Pour
    # une application « Docker Compose », l'onglet Domains ne les applique
    # qu'au prochain deploiement — et tant qu'elles manquent, Traefik ne
    # connait aucune route vers ce conteneur et repond « 404 page not found ».
    # C'est un 404 de TRAEFIK et non de nginx : le serveur va tres bien, c'est
    # le chemin jusqu'a lui qui n'existe pas. Les ecrire ici retire cette
    # panne-la du tableau.
    #
    # Le domaine se regle par une variable, avec une valeur par defaut : on
    # peut donc deployer sans rien configurer, et le changer sans toucher au
    # fichier.
    labels:
      - traefik.enable=true
      # Indispensable : sans lui, Traefik peut choisir la mauvaise interface
      # quand le conteneur est sur plusieurs reseaux, et joindre une adresse
      # qui ne repond pas.
      - traefik.docker.network=dokploy-network
      - traefik.http.services.pixelforge-engine.loadbalancer.server.port=8080
      # En clair, pour que le certificat puisse etre demande.
      - traefik.http.routers.pixelforge-engine.rule=Host(`${DOMAINE:-pixelforge-engine.srko.fr}`)
      - traefik.http.routers.pixelforge-engine.entrypoints=web
      - traefik.http.routers.pixelforge-engine.middlewares=pixelforge-vers-https
      # Et en HTTPS, avec le certificat.
      - traefik.http.routers.pixelforge-engine-tls.rule=Host(`${DOMAINE:-pixelforge-engine.srko.fr}`)
      - traefik.http.routers.pixelforge-engine-tls.entrypoints=websecure
      - traefik.http.routers.pixelforge-engine-tls.tls=true
      - traefik.http.routers.pixelforge-engine-tls.tls.certresolver=letsencrypt
      # Personne n'a de raison d'arriver en clair : on redirige.
      - traefik.http.middlewares.pixelforge-vers-https.redirectscheme.scheme=https

# Reseau cree par Dokploy a l'installation, partage avec Traefik.
networks:
  dokploy-network:
    external: true
